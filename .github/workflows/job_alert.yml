name: Job Alert Agent

on:
  schedule:
    # Staggered 15-min intervals to avoid peak GitHub traffic
    - cron: '7,37 * * * *'
    - cron: '22,52 * * * *'
  workflow_dispatch:

jobs:
  run-job-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Ensure numpy and pandas are ready for JobSpy/Trackers
          pip install "numpy>=2.0.0" "pandas>=2.0.0"
          pip install -r requirements.txt --ignore-installed

      - name: Run job alert
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Ensure this matches the variable name used in your matcher.py
          OPENAI_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GCP_SERVICE_ACCOUNT_JSON: ${{secrets.GCP_SERVICE_ACCOUNT_JSON}}
          GSHEET_URL: ${{secrets.GSHEET_URL}}
          YOUR_NAME: "Aishwarya"
        run: python main.py
