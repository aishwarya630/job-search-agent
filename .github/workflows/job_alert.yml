name: Job Alert Agent

on:
  schedule:
    - cron: '*/15 * * * *'  # every 30 minutes
  workflow_dispatch:          # allows manual trigger from GitHub UI

jobs:
  run-job-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/upload-artifact@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install dependencies
        run: |
          pip install selenium webdriver-manager beautifulsoup4
          pip install httpx groq google-genai
          pip install pdfplumber python-dotenv

      - name: Run job alert
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python main.py

      - name: Save tracker state
        uses: actions/upload-artifact@v3
        with:
          name: tracker-state
          path: |
            seen_jobs.json
            skill_gaps.json

      - name: Commit tracker updates
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add seen_jobs.json skill_gaps.json
          git diff --staged --quiet || git commit -m "update job tracker [skip ci]"
          git push